[project]
name = "punchwalk"
version = "0.1.0"
description = "Turn a construction punch walk into a verified, dispatched punch list."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "openai>=1.50",
    "meta-sam-parser>=0.1.0",
    "opencv-python-headless>=4.10",
    "numpy>=1.26",
    "scipy>=1.13",
    "pillow>=10.4",
    "jinja2>=3.1",
    "weasyprint>=62",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0",
    "qrcode>=7.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["punchwalk"]

[tool.uv]
package = true

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["web", "punchwalk/static", "data", "footage", ".verify"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning:weasyprint.*"]
